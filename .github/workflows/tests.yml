# Runs the tests on every push and pull request, on a Mac: exports, session files, model lookup, subtitles, audio
# conversion; then builds the app (ad hoc signature) and runs its built-in check, which also covers the French strings.
# No microphone, calendar, Whisper model or Apple Developer certificate needed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: swift test
      - name: Build the app
        run: scripts/build.sh
      - name: Built-in check
        run: build/Earshot.app/Contents/MacOS/Earshot --check
      - name: Scripts parse
        run: |
          zsh -n scripts/build.sh
          zsh -n Resources/install-kyutai.sh
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" Resources/kyutai-stt.py

  secrets:
    # Scans the whole git history for secrets, so pushes made without the local pre-push hook are covered too
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
