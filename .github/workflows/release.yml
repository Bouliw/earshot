# Builds Earshot.dmg on a Mac when a version tag is pushed, attaches it to the draft release of that tag
# and publishes it, so the download link in the README never points to a release without its DMG.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Version matches the tag
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Info.plist says $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Unit tests
        run: swift test
      - name: Build the DMG
        run: scripts/build.sh --dmg
      - name: Built-in check
        run: |
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/dmg" build/Earshot.dmg
          "$RUNNER_TEMP/dmg/Earshot.app/Contents/MacOS/Earshot" --check
          hdiutil detach -quiet "$RUNNER_TEMP/dmg"
      - name: Attach the DMG and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" build/Earshot.dmg --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
