# Code scanning with CodeQL for the workflows, the Python helper and the Swift app. The Swift code is built by hand
# on macOS 26, the same runner as the tests: the package needs Swift 6.2 and the macOS 26 SDK, which the default
# setup's macOS runner does not have, so its automatic build never finished. Traced by CodeQL, the build compiles
# FluidAudio again file by file and takes 30 to 50 minutes, so the scan runs only when the code it covers changes,
# plus once a week.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Resources/*.py"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Resources/*.py"
      - ".github/workflows/**"
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the Swift package
        if: matrix.language == 'swift'
        run: swift build
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
