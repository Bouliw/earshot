# Code scanning with CodeQL. The workflows and the Python helper are scanned on every change, in about a minute.
# The Swift app is scanned once a week and on demand: traced by CodeQL, its build compiles FluidAudio again file by
# file, slowly and with a lot of memory. With the usual parallel jobs a hosted Mac can run out of memory and drop
# off after an hour or more, so the scan compiles one file at a time and is given up to four hours. It runs on
# macOS 26, like the tests, because the package needs Swift 6.2 and the macOS 26 SDK.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "Resources/*.py"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "Resources/*.py"
      - ".github/workflows/**"
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  swift:
    name: Analyze (swift)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: swift
          build-mode: manual
      - name: Build the Swift package, one job at a time
        run: swift build --jobs 1
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:swift"
